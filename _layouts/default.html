<!DOCTYPE html>
<html lang="en">
    {% include head.html %}
    <body>
        <a href="#main-content" class="skip-link">Skip to content</a>
        {% if site.design_preview %}
        <aside class="preview-banner" aria-label="Local design preview"><div class="container-site"><span>LOKALNY PROTOTYP · Odświeżona obecna strona</span><div>{% if site.design_baseline %}<a href="http://127.0.0.1:4175{{ page.url }}">Przed zmianami ↗</a>{% endif %}<a href="{{ '/design-system/' | relative_url }}">Design system</a></div></div></aside>
        {% endif %}
        {% include navigation.html %}
        <main id="main-content" class="container-site{% unless page.wide or page.layout == 'post' %} document-content{% endunless %}">
            {{ content }}
        </main>
        {% include footer.html %}
    </body>
</html>
