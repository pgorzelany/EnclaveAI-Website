title: "Enclave AI"
short_title: "Enclave AI"
email: "enclave-support@agentmail.to"
description: "Private AI for iPhone, iPad and Mac. Chat, write and explore with local models that work offline, and choose optional cloud models when you need them."
baseurl: ""
url: "https://enclaveai.app"

# App download link
app_store_url: "https://apps.apple.com/app/apple-store/id6476614556?pt=117876009&ct=enclave-website&mt=8"
app_store_blog_footer_url: "https://apps.apple.com/app/apple-store/id6476614556?pt=117876009&ct=enclave-blog-footer&mt=8"

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# Pagination
paginate: 10
paginate_path: "/blog/page/:num/"

# Social media and site info
author: Enclave AI
twitter:
  username: enclave_ai
  card: summary
logo: /assets/images/enclave-icon.webp
favicon: /assets/images/favicon-32x32.png

# Include _pages directory and specific files
include:
  - _pages
  - google49916d0afa2ae3e9.html  # Add your verification file here

# Exclude development-specific files
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - README.md
  - package.json
  - package-lock.json
  - tailwind.config.js
  - agent-guides/rules/design-system.md
  - _design-preview

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default" 

# Site-wide announcement banner
announcement:
  enabled: false
  text: "Enclave is temporarily unavailable on the App Store. It should be back within a few days."
