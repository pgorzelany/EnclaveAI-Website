- question: "Does Enclave work offline?"
  answer: "Yes. Download a local model while connected to the internet, then use it offline. Optional cloud models and online tools need an internet connection."

- question: "What stays on my device?"
  answer: "When you use a local model, your prompts, attachments and conversation are processed on your device to generate the reply. Cloud models send the request through Enclave and OpenRouter to the serving model provider. Usage and diagnostic data are described in our [data guide](/how-enclave-uses-data/)."

- question: "Which devices can I use?"
  answer: "Enclave is available for iPhone, iPad and Mac. The models you can run depend on available memory and storage. Check the App Store for current device and operating-system compatibility."

- question: "Can I use Enclave for free?"
  answer: "Yes. Local AI is free to use. An optional Pro subscription adds access to cloud models with a monthly credit allowance. See [pricing](/pricing/) for details; regional prices and subscription terms are shown in the app."

- question: "Can I talk to Enclave or use it in Shortcuts?"
  answer: "Yes. Enclave supports voice conversations, custom assistants and Shortcuts integration. Choose a local model for on-device responses; cloud models require an internet connection and remote processing."

- question: "How do I choose a model?"
  answer: "Start with a smaller local model that fits your device. Larger models need more memory and storage, and performance varies by hardware. You can explore different local models or choose an optional cloud model for a different task."

- question: "Can I return to earlier conversations?"
  answer: "Yes. Your conversation history is stored on your device. Open a previous conversation to continue it, search your history, or remove conversations you no longer need. Enclave does not keep a server-side copy of that history."

- question: "What is different on iPhone, iPad and Mac?"
  answer: "All three offer local AI conversations, model selection and custom assistants, with interfaces adapted to the platform. The local models you can run depend on your device’s available memory and storage. A Mac with more memory can run larger models than a less capable device."

- question: "What happens when I attach a document?"
  answer: "Enclave extracts text from supported PDF and text files on your device. You can then ask questions or request a summary. With a local model, that context is processed on your device; with a cloud model, relevant extracted text can be included in the remote request."

- question: "Which model is used in a Shortcut?"
  answer: "Enclave’s Shortcuts integration lets you select a model for the task. Choose a local model for on-device responses, or a cloud model when you want remote processing. Cloud models need an internet connection."
